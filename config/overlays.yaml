# Post-model adjustments (RBI para 131; Annex 4 Table 6 "Post Model Adjustment").
# Developer proposals, NOT RBI values. Governance fields are enforced in Module 9.
# Calibrated values are copied here from models/scenarios/co3_calibration.json (generated by
# `ecl crisis-replay`); this file is the approved source that the scenario PDs read.
version: ov-0.1.0
rbi_specified: false

overlays:
  CO-3:
    name: Downside crisis multiplier on default odds
    status: applied                    # accepted as calibrated (Yash, 2026-11-14, option 1); limitation L6
    applies_to: downside scenario only (never base or upside)
    model: pd_lifetime (pdlife-0.4.0) with macro_scenarios (scen-0.1.0)
    calculation: >-
      In each downside quarter with z_q < long-run Z (-0.207), default odds against survival x
      M^s (prepayment hazard unchanged); the 12-month PIT PD's odds x M^(s x share of stressed
      year-1 quarters). s = min(1, (Z_lr - min Z_downside) / (Z_lr - min Z_replay)).
    calibration:
      data: Freddie Mac 2006-2007 vintages, dev_holdout loans, replay step R3 (satellite Z +
        beta state house prices), 5-year cumulative default matched, sand / other split
      split_reason: pooled M leaves both regions outside 0.8-1.25 and the regional 90% intervals
        do not overlap
      m: {CA/FL/NV/AZ: 3.062, other: 1.209}
      m_interval_90: {CA/FL/NV/AZ: [2.862, 3.279], other: [1.160, 1.264]}
      z_min_replay: -1.0315          # R3 satellite z_q trough, 2005Q1-2012Q4
      evidence: reports/summary/crisis_replay.csv; models/scenarios/co3_calibration.json
    acceptance:
      calibrated_2006_2007_5y: pass  # 0.90-1.09 national and both regions (tolerance 0.9-1.1)
      holdout_2005: fail             # national 0.71 (3y) / 0.82 (5y); sand 0.51 / 0.78; other 0.80 / 0.84
      direction_of_failure: conservative (over-predicts 2005 defaults)
      owner_decision: accepted as calibrated (Yash, 2026-11-14); limitation L6, re-test on any refit
    root_cause: >-
      R1 (measured Z, actual state HPI) already under-predicts 2006-07 (vintage effect not in the
      hazard); the satellite's trough is shallower than measured Z (R2); beta state paths without
      intercepts under-state the sand-state bust (R3 sand 2.3x). The 2005 vintage needed no uplift
      (R3 0.98 / 1.19): a uniform multiplier over stressed quarters front-loads its defaults.
    removal_trigger: >-
      Remove when a refitted model (a regional factor in the hazard, or a satellite that reaches
      the crisis trough) passes R3 within 0.8-1.25 at 3 and 5 years on 2005-07 without M.
    review_triggers:
      - annual review; and whenever the satellite or the hazard is refitted
      - the 90% interval of either M includes 1
    owner: Yash
    approvals: []                      # Module 9: two approvers required
  CO-1:
    name: COVID / mass forbearance (Module 2 OOT2 60-89 dpd over-prediction)
    status: candidate                  # recorded, not applied (config/models.yaml pd_12m)
  CO-2:
    name: ever_deferred under-prediction (Module 2 OOT1)
    status: candidate                  # recorded, not applied (config/models.yaml pd_12m)
  CO-4:
    name: Early performance of the 2024-26 vintages (unseen by the PD and hazard models)
    status: candidate_monitored        # early-performance trigger fired; ex-relief 2024 ratio ~1.15; not applied (Yash, 2026-11-14)
    evidence: >-
      reports/summary/early_performance_2024_26.csv (as at 2026-03): first RBI default incidence
      of the 2024 vintage 1.54 / 2.04 / 1.56 / 1.34 x the PIT-adjusted 2000-16 benchmark at
      loan ages 0-5 / 6-11 / 12-17 / 18-23 months (49-233 defaults per band; 1.64 overall);
      2025 vintage 1.12; 30+ and 90+ dpd stock below the benchmark (0.41-0.84). About 30% of
      the 2024 early defaults are under relief (disaster / forbearance; B-18 would relabel those
      that cure); excluding them the 2024 ratio is about 1.15.
    trigger: actual / expected > 1.25 in a vintage x 6-month age band with >= 20 events
    next_step: re-test at the next reporting date with B-18 labels for the 2024 relief cases; if
      the ratio stays > 1.25 after relief cures, quantify an odds multiplier for 2024-26 vintages
    owner: Yash
  CO-5:
    name: Downturn LGD in the downside scenario (crisis gap of the LGD model)
    status: applied                    # rule set by Yash 2026-11-14: overlay only if the backtest
                                       # shows a non-conservative crisis gap; it does (1.21 > 1.10)
    applies_to: downside scenario only, defaults in stressed years (default quarter z_q < long-run Z)
    model: lgd (lgd-0.2.0, cure intercept recalibrated on 2012-19)
    calculation: >-
      LGD_y x (1 + (ratio - 1) x s), capped at 1; ratio = crisis-period (2007-11 defaults)
      actual / predicted LGD of the development fit; s = the CO-3 severity scale of the downside
      (downside Z trough relative to the crisis replay trough), so a crisis-depth downside gets
      the full crisis gap and a milder one proportionally less.
    ratio: 1.507                       # models/lgd/fit_summary.json crisis_actual_to_pred_lgd (lgd-0.2.0)
    ratio_option1: 1.207               # same with the development fit (option 1 sensitivity)
    ratio_note: >-
      recomputed against the model in use: the recalibration lowers the predicted level, so the
      crisis gap widens from 1.21 to 1.51 (mechanism kept, owner decision 2026-11-14)
    evidence: reports/summary/lgd_validation.csv (period rows); crisis no-cure 0.576 vs 0.534,
      severity 0.510 vs 0.464 at the observed indexed LTV
    root_cause: indexed LTV at default does not carry the further fall in house prices between
      default and sale, nor the deeper distressed-sale discounts and longer timelines of 2008-11
    removal_trigger: a refitted LGD model with crisis-period actual / predicted <= 1.10
    review_triggers:
      - annual review; on any refit of the LGD models
    owner: Yash
    approvals: []
